services:
  traefik:
    image: traefik:v3.6
    container_name: vami-traefik
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - vami-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: vami-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - vami-network
    restart: unless-stopped

  minio:
    # Pinned to a specific immutable release — never use 'latest'
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: vami-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - vami-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: vami-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vami-network
    restart: unless-stopped

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    container_name: vami-identity-service
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      PAGINATION_SECRET: ${PAGINATION_SECRET:-dev-pagination-secret-32-chars-long!}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-dev-internal-secret}
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - vami-network
    restart: unless-stopped

  product-a-api:
    build:
      context: .
      dockerfile: apps/product-a-api/Dockerfile
    container_name: vami-product-a-api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      IDENTITY_SERVICE_URL: http://identity-service:5000
      IDENTITY_JWKS_URL: http://identity-service:5000/.well-known/jwks.json
      PAGINATION_SECRET: ${PAGINATION_SECRET:-dev-pagination-secret-32-chars-long!}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-dev-internal-secret}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      - identity-service
    networks:
      - vami-network
    restart: unless-stopped

  product-a-web:
    build:
      context: .
      dockerfile: apps/product-a-web/Dockerfile
    container_name: vami-product-a-web
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - product-a-api
    networks:
      - vami-network
    restart: unless-stopped

networks:
  vami-network:
    driver: bridge

volumes:
  redis_data:
  minio_data:
  postgres_data:
