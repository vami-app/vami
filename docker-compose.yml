services:
  traefik:
    image: traefik:v3.6
    container_name: vami-traefik
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - vami-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: vami-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - vami-network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: vami-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - vami-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: vami-postgres
    environment:
      POSTGRES_USER: vami
      POSTGRES_PASSWORD: vamipassword
      POSTGRES_DB: vami_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vami -d vami_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vami-network
    restart: unless-stopped

networks:
  vami-network:
    driver: bridge

volumes:
  redis_data:
  minio_data:
  postgres_data:
