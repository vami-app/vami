name: Vami Monorepo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Set Nx SHA for affected checks
        uses: nrwl/nx-set-shas@v4

      - name: Lint Affected Projects
        run: pnpm nx affected -t lint

      - name: Typecheck Affected Projects
        run: pnpm nx affected -t typecheck

      - name: Test Affected Projects
        run: pnpm nx affected -t test

      - name: Build Affected Projects
        run: pnpm nx affected -t build
