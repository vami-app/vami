name: Vami Monorepo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR when a new commit arrives.
# This prevents stacked CI runs from wasting runner minutes on stale code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Principle of least privilege — GITHUB_TOKEN gets read-only access by default.
# Jobs that require write access declare it explicitly at the job level.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        # Pinned to immutable commit SHA — not a mutable @v4 tag.
        # Tag reference kept as comment for human readability.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df49dd1f7566d33261621255e14 # v4.0.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed1d3f858276 # v4.0.4
        with:
          # Node 22 — current LTS. Node 20 reached EOL April 2026.
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Security Audit
        # Fail CI on any high or critical severity vulnerability in dependencies.
        # moderate/low are reported but do not block the build.
        run: pnpm audit --audit-level=high

      - name: Set Nx SHA for affected checks
        uses: nrwl/nx-set-shas@a90a42436d4f93c042398495a45b642642a8b9f7 # v4.2.0

      - name: Lint Affected Projects
        run: pnpm nx affected -t lint

      - name: Typecheck Affected Projects
        run: pnpm nx affected -t typecheck

      - name: Test Affected Projects
        run: pnpm nx affected -t test

      - name: Build Affected Projects
        run: pnpm nx affected -t build
