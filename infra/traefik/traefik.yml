api:
  # insecure: false — dashboard is NOT exposed on an open port.
  # For local development, the Traefik dashboard is accessible via the
  # dedicated traefik entrypoint (port 8080) which must be firewalled
  # or IP-restricted in any non-local environment.
  # In production: remove the 8080 port binding from docker-compose entirely.
  insecure: false
  dashboard: true

ping:
  entryPoint: "traefik"

providers:
  docker:
    exposedByDefault: false
    endpoint: "unix:///var/run/docker.sock"

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
  # Dedicated entrypoint for Traefik dashboard and healthcheck.
  # Never expose this entrypoint publicly; bind only to localhost or remove in prod.
  traefik:
    address: ":8080"
